name: Paquete ZIP

on:
  push:
    branches: [main, 'version-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  verificar:
    name: Verificar ZIP de integración
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s herramientas
      - run: python3 -B herramientas/paquete.py --check

  sincronizar:
    name: Comprobar y sincronizar ZIP
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/version-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: paquete-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}
      - run: python3 -B -m unittest discover -s herramientas
      - name: Actualizar ZIP de la rama
        run: |
          python3 -B herramientas/paquete.py
          git add -- GuiaAventurero-ultima.zip
          python3 -B herramientas/paquete.py --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Actualiza el ZIP del addon'
          git push origin "HEAD:$GITHUB_REF"
